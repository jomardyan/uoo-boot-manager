name: Create requested release tag

# Manual only: run it from Actions > Create requested release tag > Run workflow, on main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to tag and publish; it must equal the Linux and Windows versions (for example 2.2.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Create the requested release tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.request.outputs.version }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version, create immutable tag, and dispatch release builds
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/package-version.py)"
          windows_version="$(python3 -c 'from xml.etree import ElementTree as E; print(E.parse("windows/Directory.Build.props").findtext(".//Version"))')"
          if [[ "$windows_version" != "$version" || "$REQUESTED_VERSION" != "$version" ]]; then
            printf 'The requested version (%s) must equal the Linux version (%s) and the Windows version (%s).\n' \
              "$REQUESTED_VERSION" "$version" "$windows_version" >&2
            exit 1
          fi
          tag="v$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          if existing="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              printf 'Refusing to move existing tag %s to another commit.\n' "$tag" >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          # Token-created tag pushes do not trigger workflows; dispatch both explicitly.
          gh workflow run verify.yml --ref "$tag" -f run_vm=true
          gh workflow run windows.yml --ref "$tag"

  publish:
    name: Publish the verified release
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for both release workflows, verify every package, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.tag.outputs.version }}
        run: |
          python3 scripts/publish-release.py --repo "$GH_REPO" \
            --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" \
            --notes "docs/releases/$RELEASE_VERSION.md"
