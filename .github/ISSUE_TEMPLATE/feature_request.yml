name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Uoo to do?
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Ubuntu, Other Linux distribution, Windows 11]
