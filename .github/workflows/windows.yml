name: Build Windows 11 packages

# Manual only: run it from Actions > Windows 11 packages > Run workflow, on a branch or a v* tag.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Windows ${{ matrix.arch }} build, BCD, desktop and installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runtime: win-x64
            runner: windows-2025
          - arch: arm64
            runtime: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Validate version and release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = ([xml](Get-Content windows/Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$version") { throw "Expected release tag v$version" }
          if (!(Select-String -Path uoo/__init__.py -SimpleMatch "`"$version`"" -Quiet)) { throw 'Windows and Linux release versions differ.' }
      - name: Run validation, demo and transport tests
        run: dotnet run --project windows/Uoo.Tests -c Release
      - name: Run real WMI tests against an isolated BCD store
        run: dotnet run --project windows/Uoo.Platform.Tests -c Release
      - name: Verify change and restore transactions on this disposable Windows VM
        env:
          UOO_DISPOSABLE_WINDOWS: '1'
        run: dotnet run --project windows/Uoo.Platform.Tests -c Release -- --live-integration 'build/windows/screenshots-${{ matrix.arch }}/live-transactions.json'
      - name: Install pinned installer compiler
        if: ${{ !cancelled() }}
        run: ./windows/scripts/install-build-tools.ps1
      - name: Build self-contained desktop, helper and installer
        if: ${{ !cancelled() }}
        run: ./windows/scripts/build.ps1 -Runtime '${{ matrix.runtime }}' -InnoCompiler $env:UOO_INNO_COMPILER
      - name: Install, render native pages, and uninstall
        if: ${{ !cancelled() }}
        run: ./windows/scripts/smoke-installed.ps1 -Architecture '${{ matrix.arch }}'
      - name: Upload Windows packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-${{ matrix.arch }}
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
            dist/windows/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload desktop verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-verification-${{ matrix.arch }}
          path: build/windows/screenshots-${{ matrix.arch }}/
          if-no-files-found: warn
          retention-days: 30

  collect:
    name: Collect Windows downloads and checksums
    needs: build
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-build-*
          merge-multiple: true
          path: dist
      - name: Generate complete checksum manifest
        run: |
          $packages = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(exe|zip)$' } | Sort-Object Name)
          if ($packages.Count -ne 4) { throw 'Expected x64 and ARM64 installers and portable archives.' }
          $lines = $packages | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          [IO.File]::WriteAllLines((Join-Path $PWD 'dist/SHA256SUMS-Windows'), [string[]]$lines, [Text.UTF8Encoding]::new($false))
          Remove-Item dist/SHA256SUMS -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-packages
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Attach Windows packages to draft release
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    needs: collect
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-packages
          path: dist
      - name: Create draft if needed and attach Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "Uoo Boot Manager $env:RELEASE_TAG" --generate-notes
            # The Linux workflow may create the same draft concurrently.
            if ($LASTEXITCODE -ne 0) { gh release view $env:RELEASE_TAG *> $null; if ($LASTEXITCODE -ne 0) { throw 'Could not create or locate the draft release.' } }
          }
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'Refusing to replace assets on a published release.' }
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Windows release upload failed.' }
