name: Validate WinGet package

# Manual only: run it from Actions > Validate WinGet package > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: WinGet ${{ matrix.arch }} install and uninstall
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Prepare manifests for the actual published release
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content windows/Directory.Build.props -Raw)).Project.PropertyGroup.Version
          python scripts/build-winget.py --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Published installer and checksum verification failed.' }
      - name: Prepare Microsoft WinGet client
        run: |
          $ErrorActionPreference = 'Stop'
          # Use the same pinned Microsoft client on both native architectures.
          # Install its signed bundle and dependencies without a Store login.
          $base = 'https://github.com/microsoft/winget-cli/releases/download/v1.29.380/'
          $downloads = @{
            'DesktopAppInstaller_Dependencies.zip' = 'BA875AFE9D190F61218985AC0292A99D1DB710BF93E13C68944CA9D89F0D82D1'
            'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle' = '65DEA9C01CE08EE7B763366B27C0E651F97DB857C11CA9B9C301826C10092F2E'
          }
          foreach ($name in $downloads.Keys) {
            $destination = Join-Path $env:RUNNER_TEMP $name
            Invoke-WebRequest ($base + $name) -OutFile $destination
            if ((Get-FileHash $destination -Algorithm SHA256).Hash -ne $downloads[$name]) { throw "Microsoft download hash mismatch: $name" }
          }
          $dependencies = Join-Path $env:RUNNER_TEMP 'winget-dependencies'
          Expand-Archive (Join-Path $env:RUNNER_TEMP 'DesktopAppInstaller_Dependencies.zip') $dependencies
          $native = @(Get-ChildItem (Join-Path $dependencies '${{ matrix.arch }}') -Filter '*.appx' | ForEach-Object FullName)
          Add-AppxPackage -Path (Join-Path $env:RUNNER_TEMP 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle') -DependencyPath $native -ForceApplicationShutdown
          $command = Get-Command winget -ErrorAction SilentlyContinue
          if ($command) {
            $client = $command.Source
          } else {
            $package = Get-AppxPackage Microsoft.DesktopAppInstaller | Select-Object -First 1
            $client = Join-Path $package.InstallLocation 'winget.exe'
          }
          if (!(Test-Path $client)) { throw 'Microsoft WinGet client is unavailable.' }
          "UOO_WINGET=$client" >> $env:GITHUB_ENV
          & $client --version
          if ($LASTEXITCODE -ne 0) { throw 'WinGet did not start.' }
          # Hosted Server runners can stall on Delivery Optimization. Use the
          # documented WinINet downloader for this disposable test account.
          $settings = Join-Path $env:LOCALAPPDATA 'Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState'
          New-Item -ItemType Directory -Path $settings -Force | Out-Null
          '{"network":{"downloader":"wininet"}}' | Set-Content (Join-Path $settings 'settings.json') -Encoding utf8
      - name: Validate and install the published native installer
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content windows/Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $manifest = ".\packaging\winget\manifests\h\HaykJomardyan\UooBootManager\$version"
          & $env:UOO_WINGET validate --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest validation failed.' }
          & $env:UOO_WINGET settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) { throw 'Could not enable local manifests.' }
          $output = Join-Path $env:RUNNER_TEMP 'winget-install.stdout.log'
          $errors = Join-Path $env:RUNNER_TEMP 'winget-install.stderr.log'
          $install = Start-Process -FilePath $env:UOO_WINGET -WindowStyle Hidden -PassThru -RedirectStandardOutput $output -RedirectStandardError $errors -ArgumentList @('install','--manifest',$manifest,'--architecture','${{ matrix.arch }}','--silent','--accept-package-agreements','--accept-source-agreements','--disable-interactivity')
          try {
            $deadline = (Get-Date).AddMinutes(6)
            while (!$install.WaitForExit(30000)) {
              Write-Host 'Waiting for verified installer; current installer processes:'
              Get-CimInstance Win32_Process | Where-Object { $_.Name -like '*Uoo*' -or $_.Name -like 'is-*.tmp' -or $_.ProcessId -eq $install.Id } | Select-Object ProcessId,ParentProcessId,Name,KernelModeTime,UserModeTime,ReadOperationCount,WriteOperationCount | Format-Table
              $installLog = Join-Path $env:LOCALAPPDATA 'Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir'
              Get-ChildItem $installLog -Filter 'HaykJomardyan*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1 | ForEach-Object { Get-Content $_.FullName -Tail 8 }
              if ((Get-Date) -ge $deadline) { $install.Kill($true); throw 'WinGet installer did not exit within six minutes. See the retained launch diagnostics and upstream issue microsoft/winget-cli#6506.' }
            }
            $install.WaitForExit()
            if ($install.ExitCode -ne 0) { throw "WinGet installation failed ($($install.ExitCode))." }
          } finally {
            if (Test-Path $output) { Get-Content $output -Tail 80 }
            if (Test-Path $errors) { Get-Content $errors -Tail 40 }
          }
          $registration = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{1179B417-6013-4CFA-92E3-41C9F5FC07F5}_is1'
          if ($registration.DisplayVersion -ne $version) { throw 'Installed version differs from the manifest.' }
          if ($registration.DisplayName -ne "Uoo Boot Manager $version") { throw "Unexpected installed display name: $($registration.DisplayName)" }
          foreach ($file in @('Uoo.BootManager.exe', 'Uoo.BootHelper.exe')) {
            if (!(Test-Path (Join-Path $env:ProgramFiles "Uoo Boot Manager\$file"))) { throw "Missing installed $file" }
          }
      - name: Uninstall with WinGet
        timeout-minutes: 3
        run: |
          & $env:UOO_WINGET uninstall --product-code '{1179B417-6013-4CFA-92E3-41C9F5FC07F5}_is1' --silent --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw 'WinGet uninstall failed.' }
          if (Test-Path (Join-Path $env:ProgramFiles 'Uoo Boot Manager\Uoo.BootManager.exe')) { throw 'The desktop remains after uninstall.' }
          if (Test-Path (Join-Path $env:ProgramFiles 'Uoo Boot Manager\Uoo.BootHelper.exe')) { throw 'The helper remains after uninstall.' }
      - name: Print WinGet diagnostics after a failure
        if: failure()
        run: |
          $logs = Join-Path $env:LOCALAPPDATA 'Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir'
          if (Test-Path $logs) {
            Get-ChildItem $logs -Filter '*.log' | Sort-Object LastWriteTime -Descending | Select-Object -First 3 | ForEach-Object {
              Write-Host "WinGet diagnostic file: $($_.Name)"
              Get-Content $_.FullName -Tail 100
            }
          }
      - name: Diagnose the verified x64 installer outside WinGet
        if: ${{ failure() && matrix.arch == 'x64' }}
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content windows/Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $name = "Uoo-Boot-Manager-$version-windows-x64-setup.exe"
          $installer = Join-Path $env:TEMP "WinGet\HaykJomardyan.UooBootManager.$version\$name"
          if (!(Test-Path $installer)) { throw 'The WinGet download is unavailable for a direct control test.' }
          $manifest = Get-Content ".\packaging\winget\manifests\h\HaykJomardyan\UooBootManager\$version\HaykJomardyan.UooBootManager.installer.yaml" -Raw
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if (!$manifest.Contains($hash)) { throw 'The downloaded control installer does not match the prepared manifest.' }
          Get-CimInstance Win32_Process | Where-Object { $_.Name -like '*Uoo*' -or $_.Name -like '*setup*' } | Select-Object Name, ProcessId, ParentProcessId, CommandLine | Format-List
          $log = Join-Path $env:RUNNER_TEMP 'uoo-direct-setup.log'
          Unblock-File -LiteralPath $installer
          $setup = Start-Process $installer -WindowStyle Hidden -ArgumentList @('/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$log`"") -Wait -PassThru
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ($setup.ExitCode -ne 0) { throw "Direct installation failed: $($setup.ExitCode)" }
          $uninstaller = Join-Path $env:ProgramFiles 'Uoo Boot Manager\unins000.exe'
          if (!(Test-Path $uninstaller)) { throw 'Direct installation did not produce an uninstaller.' }
          $removed = Start-Process $uninstaller -WindowStyle Hidden -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw "Direct uninstall failed: $($removed.ExitCode)" }
          Write-Host 'The same verified x64 installer installs and uninstalls directly; the WinGet launch check remains failed.'
      - name: Collect installation and WinGet diagnostics in one artifact directory
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'winget-diagnostics'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $locations = @(
            @{ Directory = $env:RUNNER_TEMP; Pattern = 'winget-install.*.log' },
            @{ Directory = $env:RUNNER_TEMP; Pattern = 'uoo-direct-setup.log' },
            @{ Directory = (Join-Path $env:LOCALAPPDATA 'Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir'); Pattern = '*.log' }
          )
          foreach ($location in $locations) {
            if (Test-Path -LiteralPath $location.Directory) {
              Get-ChildItem -LiteralPath $location.Directory -Filter $location.Pattern -File | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $destination }
            }
          }
          if (!(Get-ChildItem -LiteralPath $destination -File)) {
            'No logs were created before the preceding failure.' | Set-Content (Join-Path $destination 'no-installer-logs.txt')
          }
      - name: Retain installation and WinGet diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-diagnostics-${{ matrix.arch }}
          path: ${{ runner.temp }}/winget-diagnostics
          if-no-files-found: error
      - name: Disable local manifest support
        if: always()
        run: |
          if ($env:UOO_WINGET) { & $env:UOO_WINGET settings --disable LocalManifestFiles }
