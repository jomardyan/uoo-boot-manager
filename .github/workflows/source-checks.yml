name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify GNU Make command discovery and recipe graph
        run: |
          make help
          make -n build package clean
      - run: python -m compileall -q uoo helper.py scripts tests
      - run: make test PYTHON=python
      - run: node website/build.mjs
      - run: python scripts/check-website.py
  windows-models:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project windows/Uoo.Tests -c Release
      - run: dotnet run --project windows/Uoo.Platform.Tests -c Release -- --portable
